<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Горная Саланга — приложение для гостей курорта.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Саланга">
  <meta name="theme-color" content="#7A0030">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png?v=3">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>Горная Саланга</title>
  <link rel="manifest" href="/app/manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFF2D6; }
    #salanga-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #FFF2D6; z-index: 9999; transition: opacity .2s ease;
    }
    #salanga-splash img { width: 120px; height: 120px; object-fit: contain; }
    #salanga-splash.hide { opacity: 0; pointer-events: none; }
  </style>
  <script src="pwa_install.js"></script>
  <script src="biometric.js?v=3"></script>
</head>
<body>
  <div id="salanga-splash" aria-hidden="true">
    <img src="icons/Icon-192.png?v=5" alt="" width="120" height="120" />
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('salanga-splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 250);
    });
  </script>
</body>
</html>
