name: gornaya_salanga
description: "Горная Саланга — приложение для гостей горнолыжного курорта."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0
  webview_flutter_web: ^0.2.3
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  equatable: ^2.0.7
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.7
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFF2D6"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#FFF2D6"
    theme_color: "#7A0030"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
