services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salanga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gornaya_salanga}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salanga} -d ${POSTGRES_DB:-gornaya_salanga}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ../backend/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../backend/secrets/fcm-service-account.json:/app/secrets/fcm-service-account.json:ro
    ports:
      - target: 8080
        published: ${API_PUBLISH_PORT:-8080}
        host_ip: ${API_BIND_HOST:-0.0.0.0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
      - public

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
    restart: unless-stopped
    ports:
      - target: 80
        published: ${ADMIN_PUBLISH_PORT:-80}
        host_ip: ${ADMIN_BIND_HOST:-0.0.0.0}
    depends_on:
      api:
        condition: service_healthy
      mobile-web:
        condition: service_started
    networks:
      - public
      - internal

  mobile-web:
    build:
      context: ../mobile
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks:
      - public

networks:
  internal:
  public:

volumes:
  postgres_data:
  redis_data:
