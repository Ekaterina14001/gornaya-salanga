# Host nginx — API only (install on VPS, not inside Docker).
# certbot: certbot certonly --nginx -d api.salanga.ru

upstream salanga_api {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name api.salanga.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.salanga.ru;

    ssl_certificate     /etc/letsencrypt/live/api.salanga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.salanga.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /health {
        proxy_pass http://salanga_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://salanga_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
