server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API on port 80 (mobile carriers often block 8080)
    location /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=86400";
    }

    # Flutter web app (iPhone / Safari)
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        proxy_pass http://mobile-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Flutter /assets/* — только если файла нет у React-админки (Vite тоже пишет в /assets/).
    location ^~ /assets/ {
        try_files $uri @mobile_web_assets;
    }

    location @mobile_web_assets {
        proxy_pass http://mobile-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /icons/ {
        proxy_pass http://mobile-web:80/icons/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /canvaskit/ {
        proxy_pass http://mobile-web:80/canvaskit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        proxy_pass http://mobile-web:80/flutter_bootstrap.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /main.dart.js {
        proxy_pass http://mobile-web:80/main.dart.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /pwa_install.js {
        proxy_pass http://mobile-web:80/pwa_install.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /biometric.js {
        proxy_pass http://mobile-web:80/biometric.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /version.json {
        proxy_pass http://mobile-web:80/version.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        proxy_pass http://mobile-web:80/manifest.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.png {
        proxy_pass http://mobile-web:80/favicon.png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Firebase web push worker (requested from site root by Flutter web)
    location = /firebase-messaging-sw.js {
        proxy_pass http://mobile-web:80/firebase-messaging-sw.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
